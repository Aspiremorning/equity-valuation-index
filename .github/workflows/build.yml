name: Build EVI Dashboard

on:
  schedule:
    # 12:30 UTC = 6:00 PM IST, after market close & data entry.
    - cron: "30 12 * * 1-5"
  workflow_dispatch: {}        # manual "Run workflow" button
  push:
    branches: [main]
    paths: ["data/**", "scripts/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dashboard from Google Sheet
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
        run: python scripts/build.py

      - name: Commit & push if changed
        run: |
          git config user.name "evi-bot"
          git config user.email "actions@github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "EVI auto-build $(date -u +'%d-%b-%Y %H:%M UTC')"
            git push
          fi
